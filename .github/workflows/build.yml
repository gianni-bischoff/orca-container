name: build

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      orca_version:
        description: 'Orca release tag to build (e.g. v1.4.218); empty = latest'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Compute build args
        id: args
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_ORCA_VERSION: ${{ github.event.inputs.orca_version }}
        run: |
          set -euo pipefail
          if [ "${REF_TYPE}" = "tag" ]; then
            # Repo tag should name the matching Orca release
            # (repo tag v1.4.218 -> Orca release v1.4.218).
            if curl -fsSI -o /dev/null \
              "https://github.com/stablyai/orca/releases/download/${REF_NAME}/orca-linux.AppImage"; then
              echo "orca_version=${REF_NAME}" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::No Orca release ${REF_NAME}; building latest"
              echo "orca_version=latest" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "orca_version=${INPUT_ORCA_VERSION:-latest}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern=v{{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ORCA_VERSION=${{ steps.args.outputs.orca_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (amd64)
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        run: |
          docker run --rm --entrypoint /bin/sh \
            "${{ env.IMAGE }}:${{ github.ref_name }}" -c \
            'pi --version && node --version && netbird version'